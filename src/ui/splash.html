<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colonization - Запуск гри</title>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script src="multiplayer.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        /* ===== CUSTOM CURSOR ===== */
        /* Default: golden mouse cursor arrow */
        html { cursor: url('data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2232%22 height=%2232%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M7 8 L7 24 L12 18 L16 24 L20 20 L14 14 L23 14 Z%22 fill=%22%23f39c12%22 stroke=%22%23e67e22%22 stroke-width=%220.8%22 stroke-linejoin=%22round%22 opacity=%220.95%22/%3E%3C/svg%3E') 8 8, auto !important; }
        body, body * { cursor: inherit !important; }
        /* Hover: BIG WHITE arrow with golden glow on interactive elements */
        button, .menu-btn, .mode-btn, .back-btn, .room-item, .yop-res-option, .primary, .secondary, .exit-btn, .volume-slider-container input[type="range"] {
            cursor: url('data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 40 40%22%3E%3Cpath d=%22M9 10 L9 30 L15 22 L20 30 L26 24 L18 17 L30 17 Z%22 fill=%22none%22 stroke=%22%23f1c40f%22 stroke-width=%224%22 stroke-linejoin=%22round%22 opacity=%220.6%22/%3E%3Cpath d=%22M9 10 L9 30 L15 22 L20 30 L26 24 L18 17 L30 17 Z%22 fill=%22%23ffffff%22 stroke=%22%23f39c12%22 stroke-width=%221.5%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E') 10 12, pointer !important;
        }
        /* Disabled: gray arrow */
        .menu-btn[disabled], button[disabled], .disabled, .buy-dev-btn.disabled {
            cursor: url('data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2232%22 height=%2232%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M7 8 L7 24 L12 18 L16 24 L20 20 L14 14 L23 14 Z%22 fill=%22%23888%22 stroke=%22%23666%22 stroke-width=%220.8%22 stroke-linejoin=%22round%22 opacity=%220.5%22/%3E%3C/svg%3E') 8 8, not-allowed !important;
        }
        body {
            background: linear-gradient(135deg, #0d1b2a, #1a1a2e);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .hex-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.1;
        }
        .hex {
            position: absolute;
            background: linear-gradient(135deg, #2d7d3a, #1e5c28);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: float 20s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        .main-content {
            z-index: 1;
            text-align: center;
            padding: 40px;
            background: rgba(26, 26, 46, 0.8);
            border-radius: 20px;
            border: 2px solid rgba(243, 156, 18, 0.3);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 4em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #f39c12, #e74c3c, #8e44ad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 5px;
            text-shadow: 0 0 30px rgba(243, 156, 18, 0.3);
        }
        .title {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #f39c12;
            letter-spacing: 3px;
        }
        .subtitle {
            font-size: 1.2em;
            color: #888;
            margin-bottom: 40px;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .menu-btn {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
            min-width: 250px;
        }
        .menu-btn.primary {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #fff;
        }
        .menu-btn.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(243, 156, 18, 0.4);
        }
        .menu-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .menu-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .menu-btn.exit-btn:hover {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            border-color: #e74c3c;
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.4);
        }
        .version {
            font-size: 0.9em;
            color: #666;
            margin-top: 20px;
        }
        .loading {
            display: none;
            margin-top: 20px;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(243, 156, 18, 0.3);
            border-top: 3px solid #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== SETTINGS MODAL ===== */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .settings-box {
            background: rgba(26,26,46,0.98);
            border: 2px solid #f39c12;
            border-radius: 12px;
            padding: 24px 32px;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 0 30px rgba(243,156,18,0.4);
            text-align: center;
            max-width: 420px;
            min-width: 320px;
        }
        .settings-box h3 {
            color: #f39c12;
            margin-bottom: 16px;
            font-size: 1.3em;
        }
        .settings-box button {
            width: 100%;
            padding: 14px 24px;
            font-size: 1.05em;
            margin: 6px 0;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .settings-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(243,156,18,0.4);
        }
        .settings-box button:active {
            transform: translateY(0);
        }
        .settings-box button.back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
.settings-box button.back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
        .settings-box button.back-btn.exit-btn:hover {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            border-color: #e74c3c;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }

        /* ===== VOLUME SETTINGS ===== */
        .volume-slider-container {
            margin: 12px 0;
            text-align: left;
        }
        .volume-slider-container label {
            display: block;
            color: #ccc;
            margin-bottom: 6px;
            font-size: 0.95em;
            font-weight: 600;
        }
        .volume-slider-container input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .volume-slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #f39c12;
            cursor: url('data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 40 40%22%3E%3Cpath d=%22M9 10 L9 30 L15 22 L20 30 L26 24 L18 17 L30 17 Z%22 fill=%22none%22 stroke=%22%23f1c40f%22 stroke-width=%224%22 stroke-linejoin=%22round%22 opacity=%220.6%22/%3E%3Cpath d=%22M9 10 L9 30 L15 22 L20 30 L26 24 L18 17 L30 17 Z%22 fill=%22%23ffffff%22 stroke=%22%23f39c12%22 stroke-width=%221.5%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E') 10 12, pointer !important;
            border: 2px solid #fff;
        }
        .volume-slider-container input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #f39c12;
            cursor: url('data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 40 40%22%3E%3Cpath d=%22M9 10 L9 30 L15 22 L20 30 L26 24 L18 17 L30 17 Z%22 fill=%22none%22 stroke=%22%23f1c40f%22 stroke-width=%224%22 stroke-linejoin=%22round%22 opacity=%220.6%22/%3E%3Cpath d=%22M9 10 L9 30 L15 22 L20 30 L26 24 L18 17 L30 17 Z%22 fill=%22%23ffffff%22 stroke=%22%23f39c12%22 stroke-width=%221.5%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E') 10 12, pointer !important;
            border: 2px solid #fff;
        }
        .volume-value {
            color: #f1c40f;
            font-weight: bold;
            margin-left: 8px;
        }

        /* ===== ROOM ITEMS ===== */
        .room-item:hover {
            background: rgba(243, 156, 18, 0.15) !important;
            border-color: #f1c40f !important;
        }
        
        /* ===== COLOR SELECTION ===== */
        .color-option:disabled {
            cursor: url('data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2232%22 height=%2232%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M7 8 L7 24 L12 18 L16 24 L20 20 L14 14 L23 14 Z%22 fill=%22%23888%22 stroke=%22%23666%22 stroke-width=%220.8%22 stroke-linejoin=%22round%22 opacity=%220.5%22/%3E%3C/svg%3E') 8 8, not-allowed !important;
        }
    </style>
</head>
<body>
    <div class="background-animation" id="bgAnimation"></div>
    
<div class="main-content">
    <div class="logo">COLONIZATION</div>
    <div class="menu-buttons">
        <button class="menu-btn primary" id="newGameBtn">Нова гра</button>
        <button class="menu-btn secondary" id="settingsBtn">Налаштування</button>
        <button class="menu-btn secondary exit-btn" id="exitBtn">Вийти</button>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Завантаження...</div>
    </div>

</div>

<!-- Game Mode Selection Modal -->

</div>

<!-- Multiplayer Lobby Modal -->
<div class="settings-overlay" id="multiplayerLobbyModal" style="display: none;">
    <div class="settings-box" style="max-width: 500px; min-width: 400px;">
        <h3>МУЛЬТИПЛЕЕР</h3>
        
        <!-- Loading indicator -->

            <div style="color: #f39c12; font-size: 1.1em; margin-bottom: 8px;">Підключення</div>

</div>

<!-- Create Room Modal -->
<div class="settings-overlay" id="createRoomModal" style="display: none;">
    <div class="settings-box">
        <h3>СТВОРИТИ КІМНАТУ</h3>

        </div>

        <button id="confirmCreateRoom" class="mode-btn">Створити</button>
        <button id="backFromCreateRoom" class="back-btn">Назад</button>

</div>
<!-- Room Created Modal -->
<div class="settings-overlay" id="roomCreatedModal" style="display: none;">
    <div class="settings-box">
        <h3>КІМНАТА СТВОРЕНА</h3>

</div>

<!-- Color Selection Modal -->
<div class="settings-overlay" id="colorSelectionModal" style="display: none;">
    <div class="settings-box" style="max-width: 400px;">
        <h3>ВИБЕРІТЬ КОЛІР</h3>
        <div id="colorOptions" style="display: flex; gap: 10px; justify-content: center; margin: 20px 0;">
            <button class="color-option" data-color="red" style="width: 60px; height: 60px; border-radius: 50%; background: #e74c3c; border: 3px solid #fff; cursor: pointer; transition: all 0.2s;" title="Червоний"></button>

<!-- Join Room Modal -->
<div class="settings-overlay" id="joinRoomModal" style="display: none;">
    <div class="settings-box">
        <h3>ПРИЄДНАТИСЯ ДО КІМНАТИ</h3>
        <div class="volume-slider-container">
            <label>Код кімнати:</label>
            <input type="text" id="joinCodeInput" placeholder="Введіть код кімнати" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #f39c12; background: rgba(255,255,255,0.1); color: #fff; text-transform: uppercase;">
        </div>

        <button id="backFromJoinRoom" class="back-btn">Назад</button>

</div>

<!-- Settings Modal -->
<div class="settings-overlay" id="settingsModal" style="display: none;">
    <div class="settings-box">
        <h3>НАЛАШТУВАННЯ</h3>
        <button id="volumeBtn">Гучність</button>
        <button id="backFromSettings" class="back-btn">Назад</button>
    </div>
</div>

<!-- Volume Settings Modal -->
<div class="settings-overlay" id="volumeModal" style="display: none;">
    <div class="settings-box">
        <h3>ГУЧНІСТЬ</h3>
        <div class="volume-slider-container">
            <label>Загальна гучність: <span class="volume-value" id="masterVolumeValue">100%</span></label>
            <input type="range" id="masterVolume" min="0" max="100" value="100">
        </div>
        <div class="volume-slider-container">
            <label>Музика: <span class="volume-value" id="musicVolumeValue">100%</span></label>
            <input type="range" id="musicVolume" min="0" max="100" value="100">
        </div>
        <div class="volume-slider-container">
            <label>Звуки: <span class="volume-value" id="sfxVolumeValue">100%</span></label>
            <input type="range" id="sfxVolume" min="0" max="100" value="100">
        </div>
        <button id="backFromVolume" class="back-btn">Назад</button>
    </div>
</div>

    <script>
        // Create animated hex background
        const bg = document.getElementById('bgAnimation');
        for (let i = 0; i < 20; i++) {
            const hex = document.createElement('div');
            hex.className = 'hex';
            const size = Math.random() * 100 + 50;
            hex.style.width = size + 'px';
            hex.style.height = size + 'px';
            hex.style.left = Math.random() * 100 + '%';
            hex.style.top = Math.random() * 100 + '%';
            hex.style.animationDelay = Math.random() * 20 + 's';
            bg.appendChild(hex);
        }

        // Audio Manager for splash screen
        class AudioManager {
            constructor() {
                this.masterVolume = 1.0;
                this.musicVolume = 1.0;
                this.sfxVolume = 1.0;
                this.audioContext = null;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) {
                    console.log('Web Audio API not supported');
                }
            }

            setMasterVolume(value) { this.masterVolume = value; }
            setMusicVolume(value) { this.musicVolume = value; }
            setSfxVolume(value) { this.sfxVolume = value; }

            playTone(frequency, duration, type = 'sine', volume = 0.3) {
                if (!this.initialized || !this.audioContext) return;
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                oscillator.frequency.value = frequency;
                oscillator.type = type;
                const actualVolume = volume * this.masterVolume * this.sfxVolume;
                gainNode.gain.setValueAtTime(actualVolume, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + duration);
            }

            playClickSound() {
                this.playTone(600, 0.08, 'square', 0.15);
                setTimeout(() => this.playTone(800, 0.06, 'square', 0.1), 50);
            }

            playHoverSound() { this.playTone(800, 0.05, 'sine', 0.1); }

            startBackgroundMusic() {
                if (!this.initialized || !this.audioContext || this.musicPlaying) return;
                this.musicPlaying = true;

                // Create master gain node for real-time volume control
                this.musicGainNode = this.audioContext.createGain();
                this.musicGainNode.connect(this.audioContext.destination);
                this.updateMusicVolume();

                const playNote = (freq, startTime, duration, type = 'sine', volume = 1.0) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(this.musicGainNode);
                    osc.frequency.value = freq;
                    osc.type = type;
                    const attack = 0.05;
                    const release = 0.1;
                    gain.gain.setValueAtTime(0.0, startTime);
                    gain.gain.linearRampToValueAtTime(volume, startTime + attack);
                    gain.gain.setValueAtTime(volume, startTime + duration - release);
                    gain.gain.linearRampToValueAtTime(0.0, startTime + duration);
                    osc.start(startTime);
                    osc.stop(startTime + duration + 0.05);
                };

                const playChord = (freqs, startTime, duration, type = 'sine', volume = 0.25) => {
                    freqs.forEach(f => playNote(f, startTime, duration, type, volume));
                };

// Dark Souls 3 Style - Dark, atmospheric medieval theme
                // Deep, ominous melody in D minor with slow arpeggios
                const melody = [
                    // Dark atmospheric phrase 1
                    { notes: [196.00, 185.00, 146.83, 130.81], dur: 1.5 },
                    { notes: [146.83, 130.81, 110.00, 98.00], dur: 1.5 },
                    { notes: [110.00, 130.81, 146.83, 185.00], dur: 1.5 },
                    { notes: [146.83, 0.00, 0.00, 0.00], dur: 1.5 },
                    // Dark atmospheric phrase 2
                    { notes: [130.81, 146.83, 185.00, 196.00], dur: 1.5 },
                    { notes: [146.83, 185.00, 196.00, 220.00], dur: 1.5 },
                    { notes: [185.00, 146.83, 130.81, 110.00], dur: 1.5 },
                    { notes: [110.00, 0.00, 0.00, 0.00], dur: 1.5 },
                ];

                const chords = [
                    [146.83, 185.00, 220.00],  // D minor
                    [146.83, 185.00, 220.00],  // D minor
                    [110.00, 130.81, 146.83],  // A minor
                    [110.00, 130.81, 146.83],  // A minor
                    [130.81, 164.81, 196.00],  // C major
                    [130.81, 164.81, 196.00],  // C major
                    [196.00, 246.94, 293.66],  // G minor
                    [196.00, 246.94, 293.66],  // G minor
                ];

                const playPhrase = (phraseIndex) => {
                    if (!this.musicPlaying) return;
                    const now = this.audioContext.currentTime;
                    const phrase = melody[phraseIndex % melody.length];
                    const chord = chords[phraseIndex % chords.length];

                    // Dark atmospheric accompaniment - triangle for dark, hollow sound
                    playChord(chord, now, phrase.dur * 4, 'triangle', 0.12);
                    playChord(chord.map(f => f * 0.5), now, phrase.dur * 4, 'triangle', 0.08);

                    // Melody - deep and ominous
                    phrase.notes.forEach((freq, i) => {
                        if (freq > 0) {
                            const noteStart = now + i * phrase.dur * 0.25 + phrase.dur * 0.1;
                            const noteDur = phrase.dur * 0.25;
                            playNote(freq, noteStart, noteDur, 'triangle', 0.4);
                        }
                    });

                    const nextPhraseDelay = phrase.dur * 4 * 1000;
                    this.musicTimeout = setTimeout(() => playPhrase(phraseIndex + 1), nextPhraseDelay);
                };

                // Dark intro fade-in
                const introStart = this.audioContext.currentTime;
                this.musicGainNode.gain.setValueAtTime(0.0, introStart);
                this.musicGainNode.gain.linearRampToValueAtTime(0.05 * this.masterVolume * this.musicVolume, introStart + 3.0);

                playPhrase(0);
            }

            updateMusicVolume() {
                if (!this.musicGainNode) return;
                const volume = this.masterVolume * this.musicVolume;
                // Використовуємо setValueAtTime для миттєвої зміни гучності.
                // Це єдиний безпечний спосіб уникнути спотворень при частих змінах:
                // - Не накопичує заплановані події (ramp events) в аудіографі
                // - Не створює стрибків гучності (discontinuities)
                // - Кожен новий виклик просто перезаписує попереднє значення
                this.musicGainNode.gain.setValueAtTime(volume, this.audioContext.currentTime);
            }

            stopBackgroundMusic() {
                this.musicPlaying = false;
                if (this.musicTimeout) {
                    clearTimeout(this.musicTimeout);
                }
            }
        }

                        <button class="change-color-btn" data-player-id="${p.id}" ${isCurrentUser ? '' : 'disabled'} style="width: 32px; height: 32px; border-radius: 50%; background: ${color}; border: 3px solid ${color}; box-shadow: 0 0 0 2px #fff; cursor: ${isCurrentUser ? 'pointer' : 'not-allowed'}; transition: all 0.2s; padding: 0;" title="${isCurrentUser ? 'Змінити колір' : 'Можна змінити тільки свій колір'}"></button>
                    </div>`;
                } else {
                    return `<div style="padding: 8px; background: ${color}22; border-radius: 5px; color: ${color}; border-left: 4px solid ${color}; display: flex; align-items: center; justify-content: space-between;">
                        <span>Гравець</span>
                        <button class="change-color-btn" data-player-id="${p.id}" ${isCurrentUser ? '' : 'disabled'} style="width: 32px; height: 32px; border-radius: 50%; background: ${color}; border: 3px solid ${color}; box-shadow: 0 0 0 2px #fff; cursor: ${isCurrentUser ? 'pointer' : 'not-allowed'}; transition: all 0.2s; padding: 0;" title="${isCurrentUser ? 'Змінити колір' : 'Можна змінити тільки свій колір'}"></button>
                    </div>`;

            // Add click handlers to color change buttons (only for current user)
            document.querySelectorAll('.change-color-btn').forEach(btn => {

        // Function to update players list for guest (marks self as "ви")
        function updatePlayersListForGuest(players, mySocketId) {
            const playersList = document.getElementById('playersList');

                'red': '#e74c3c',
                'blue': '#3498db',
                'yellow': '#f1c40f',
                'green': '#27ae60'
            };
            const defaultColors = ['red', 'blue', 'yellow', 'green'];
            
            // Ensure all players have colors
            players.forEach((p, index) => {
                if (!p.color) {
                    p.color = defaultColors[index] || 'red';
                }
            });
            
            playersList.innerHTML = players.map((p, index) => {
                const color = colorMap[p.color] || '#f39c12';
                const isCurrentUser = p.id === mySocketId;
                const disabledStyle = isCurrentUser ? '' : 'opacity: 0.4; cursor: not-allowed;';
                
                if (p.isHost) {
                    // Show host with disabled color button (same layout as host sees, but non-clickable)
                    return `<div style="padding: 8px; background: ${color}22; border-radius: 5px; color: ${color}; border-left: 4px solid ${color}; display: flex; align-items: center; justify-content: space-between;">
                        <span>Гравець (хозяїн)</span>
                        <button disabled style="width: 32px; height: 32px; border-radius: 50%; background: ${color}; border: 3px solid #fff; box-shadow: 0 0 0 2px #fff; cursor: not-allowed; transition: all 0.2s; padding: 0; opacity: 0.6;" title="Колір хозяїна"></button>
                    </div>`;
                } else if (p.id === mySocketId) {
                    return `<div style="padding: 8px; background: ${color}22; border-radius: 5px; color: ${color}; border-left: 4px solid ${color}; display: flex; align-items: center; justify-content: space-between;">
                        <span>Гравець (ви)</span>
                        <button class="change-color-btn" data-player-id="${p.id}" style="width: 32px; height: 32px; border-radius: 50%; background: ${color}; border: 3px solid ${color}; box-shadow: 0 0 0 2px #fff; cursor: pointer; transition: all 0.2s; padding: 0;" title="Змінити колір"></button>
                    </div>`;
                } else {

                        Гравець
                    </div>`;
                }
            }).join('');
            
            // Add click handlers to color change buttons (only for self)
            document.querySelectorAll('.change-color-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    audioManager.playClickSound();

        // Copy room code button
        document.getElementById('copyRoomCodeBtn').addEventListener('click', () => {

                const btn = document.getElementById('copyRoomCodeBtn');

        // Join Room handlers
        document.getElementById('confirmJoinRoom').addEventListener('click', () => {
            audioManager.playClickSound();
            const code = document.getElementById('joinCodeInput').value.toUpperCase();
            if (code.length === 6) {
                mpClient.joinRoom(code, 'Гравець').then(data => {
                    currentRoomCode = data.roomCode;

                    // Show waiting room for guest with player list
                    document.getElementById('joinRoomModal').style.display = 'none';

                    document.getElementById('roomCodeDisplay').textContent = code;
                    // Show players list (including self as "Гравець (ви)")
                    updatePlayersListForGuest(data.players, mySocketId);
                    // Save guest's color from server response
                    const myPlayerData = data.players.find(p => p.id === mySocketId);
                    if (myPlayerData && myPlayerData.color) {
                        myPlayerColor = myPlayerData.color;

                    // Hide start game button for guest (don't destroy it)

                    document.getElementById('startGameContainer').innerHTML = `
                        <div style="color: #f39c12; font-size: 1.1em; padding: 10px; text-align: center;">

                    // Start animated dots for waiting
                    let waitingInterval = null;
                    function startWaitingAnimation() {

                    startWaitingAnimation();
                    
                    // Wait for game to start
                    mpClient.onGameStarted((data) => {
                        stopWaitingAnimation();
                        // Store map in sessionStorage for guest to use in game
                        if (data && data.mapSeed) {
                            sessionStorage.setItem('multiplayerMap', JSON.stringify(data.mapSeed));

                        // Show "Підключення" with animated dots before redirecting
                        document.getElementById('startGameContainer').innerHTML = `
                            <div style="color: #f39c12; font-size: 1.1em; padding: 10px; text-align: center;">
                                Підключення<span id="connectingDots">...</span>
                            </div>
                        `;
                        // Start connecting animation
                        let connectingInterval = null;
                        let dotCount = 0;
                        connectingInterval = setInterval(() => {
                            dotCount = (dotCount % 3) + 1;
                            const connectingDots = document.getElementById('connectingDots');

                        // Redirect after short delay
                        setTimeout(() => {
                            clearInterval(connectingInterval);
                            window.location.href = 'index.html?mode=multiplayer&code=' + code;
                        }, 1500);
                    });
                }).catch(err => {
                    alert('Помилка приєднання: ' + err);
                });
            } else {
                alert('Введіть правильний код кімнати (6 символів)');
            }
        });
        
        // Enter key support for Join Room modal
        document.getElementById('joinCodeInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();

        // Enter key support for Create Room modal
        document.getElementById('roomNameInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();

        document.getElementById('backFromJoinRoom').addEventListener('click', () => {
            audioManager.playClickSound();
            // Leave room before going back to lobby
            if (mpClient && currentRoomCode) {
                mpClient.leaveRoom();
                currentRoomCode = null;
                isHost = false;
            }
            document.getElementById('joinRoomModal').style.display = 'none';
            document.getElementById('multiplayerLobbyModal').style.display = 'flex';
            // Refresh rooms list to show updated state
            loadRoomsList();

        // Settings modal handlers
        document.getElementById('backFromSettings').addEventListener('click', () => {
            audioManager.playClickSound();
            document.getElementById('settingsModal').style.display = 'none';
        });

        document.getElementById('volumeBtn').addEventListener('click', () => {
            audioManager.playClickSound();
            document.getElementById('settingsModal').style.display = 'none';
            document.getElementById('volumeModal').style.display = 'flex';
        });

        document.getElementById('backFromVolume').addEventListener('click', () => {
            audioManager.playClickSound();
            document.getElementById('volumeModal').style.display = 'none';
            document.getElementById('settingsModal').style.display = 'flex';
        });

        // Volume sliders
        document.getElementById('masterVolume').addEventListener('input', (e) => {
            const value = e.target.value / 100;
            audioManager.setMasterVolume(value);
            audioManager.updateMusicVolume();
            document.getElementById('masterVolumeValue').textContent = e.target.value + '%';

        document.getElementById('musicVolume').addEventListener('input', (e) => {
            const value = e.target.value / 100;

            audioManager.updateMusicVolume();

        document.getElementById('sfxVolume').addEventListener('input', (e) => {
            const value = e.target.value / 100;
            audioManager.setSfxVolume(value);
            audioManager.updateMusicVolume();
            document.getElementById('sfxVolumeValue').textContent = e.target.value + '%';
            saveVolumeSettings();
        });

        // Close modals with Escape key (but not createRoomModal - it should create room on Enter)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                // Check roomCreatedModal first (special handling)
                const roomModal = document.getElementById('roomCreatedModal');
                if (roomModal && roomModal.style.display === 'flex') {
                    audioManager.playClickSound();
                    if (mpClient && currentRoomCode) {
                        mpClient.leaveRoom();
                        mpClient.disconnect();
                        currentRoomCode = null;
                        isHost = false;
                    }
                    roomModal.style.display = 'none';
                    return;
                }
                
                // Check other modals
                const modals = ['gameModeModal', 'multiplayerLobbyModal', 'joinRoomModal', 'settingsModal', 'volumeModal'];
                modals.forEach(modalId => {
                    const modal = document.getElementById(modalId);
                    if (modal && modal.style.display === 'flex') {
                        audioManager.playClickSound();
                        modal.style.display = 'none';
                        return;
                    }
                });
            }
        });

        // Close modals when clicking outside (except for room modals to prevent accidental closing)
        document.addEventListener('click', (e) => {
            const modals = ['gameModeModal', 'multiplayerLobbyModal', 'createRoomModal', 'settingsModal', 'volumeModal'];
            modals.forEach(modalId => {
                const modal = document.getElementById(modalId);
                if (modal && e.target === modal) {
                    audioManager.playClickSound();
                    modal.style.display = 'none';
                }
            });
            // For roomCreatedModal and joinRoomModal, don't close on backdrop click
            // to prevent accidental leaving from room
        });

        // Add hover sounds to all buttons
        function addHoverSounds() {
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('mouseenter', () => {
                    audioManager.playHoverSound();
                });
            });
        }

        // Add hover sounds initially
        addHoverSounds();

        // Loading animation
        let loadingInterval = null;
        
        function startLoadingAnimation() {
            const dotsElement = document.getElementById('loadingDots');
            if (!dotsElement) return;
            
            let dotCount = 0;
            loadingInterval = setInterval(() => {
                dotCount = (dotCount % 3) + 1;
                dotsElement.textContent = '.'.repeat(dotCount);
            }, 500);
        }
        
        function stopLoadingAnimation() {
            if (loadingInterval) {
                clearInterval(loadingInterval);
                loadingInterval = null;
            }
        }
        
        // Add hover sounds to dynamically created buttons
        const observer = new MutationObserver(() => {
            addHoverSounds();
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // Start background music
        audioManager.startBackgroundMusic();

        // Map generation functions (copied from index.html)
        const RESOURCE_TYPES = ['wood', 'brick', 'geese', 'water', 'stone'];
        const RESOURCE_DISTRIBUTION = [4, 3, 4, 4, 3];
        
        function hexAdd(a,b) { return { q:a.q+b.q, r:a.r+b.r, s:a.s+b.s }; }
        function hexNeighbors(hex) { const d = [{q:1,r:0,s:-1},{q:1,r:-1,s:0},{q:0,r:-1,s:1},{q:-1,r:0,s:1},{q:-1,r:1,s:0},{q:0,r:1,s:-1}]; return d.map(x => hexAdd(hex, x)); }
        function hexKey(h) { return h.q+','+h.r+','+h.s; }
        function shuffleArray(arr) { for (let i=arr.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
        // ===== ВСТАВИТИ ЦІ ФУНКЦІЇ В splash.html =====
        function hexCorners(cx, cy, size) {
            const c = [];
            for (let i = 0; i < 6; i++) {
                const a = Math.PI / 180 * (60 * i - 30);
                c.push({ x: cx + size * Math.cos(a), y: cy + size * Math.sin(a) });
            }
            return c;
        }

        function edgeKey(hex, edgeIdx) {
            const dir = (6 - edgeIdx) % 6;
            const h2 = hexNeighbors(hex)[dir];
            const k1 = hexKey(hex);
            const k2 = hexKey(h2);
            return k1 < k2 ? k1 + '|' + k2 : k2 + '|' + k1;
        }

        function vertexKey(hex, vertIdx) {
            const p = hexToPixel(hex, 1);
            const corner = hexCorners(p.x, p.y, 1)[vertIdx];
            return Math.round(corner.x * 1000) + ',' + Math.round(corner.y * 1000);
        }
        function hexToPixel(hex, size) {
            return {
                x: size * (Math.sqrt(3) * hex.q + Math.sqrt(3) / 2 * hex.r),
                y: size * (3 / 2 * hex.r)
            };
        }
        function computeEdgesAndVertices(hexPositions, hexSize) {
            const edges = new Map();
            const vertices = new Map();
            const hexSet = new Map();
            hexPositions.forEach(h => hexSet.set(hexKey(h), h));

            for (const hex of hexPositions) {
                const p = hexToPixel(hex, hexSize);
                const cx = p.x, cy = p.y;
                const corners = hexCorners(cx, cy, hexSize);

                for (let i = 0; i < 6; i++) {
                    const vk = vertexKey(hex, i);
                    if (!vertices.has(vk)) {
                        vertices.set(vk, { hexes: [], pos: corners[i] });
                    }
                    const vData = vertices.get(vk);
                    if (!vData.hexes.some(h => hexKey(h) === hexKey(hex))) {
                        vData.hexes.push(hex);
                    }

                    const dir = (6 - i) % 6;
                    const n = hexNeighbors(hex)[dir];
                    if (hexSet.has(hexKey(n))) {
                        const ek = edgeKey(hex, i);
                        if (!edges.has(ek)) {
                            const midX = (corners[i].x + corners[(i+1)%6].x) / 2;
                            const midY = (corners[i].y + corners[(i+1)%6].y) / 2;
                            edges.set(ek, {
                                hex1: hex, hex2: n,
                                cx: midX, cy: midY, angle: 0,
                                va: corners[i], vb: corners[(i+1)%6]
                            });
                        }
                    }
                }
            }
            return { edges, vertices };
        }
        // ===== КІНЕЦЬ ВСТАВКИ =====
        function generateHexRing(r) { if (r===0) return [{q:0,r:0,s:0}]; const h=[], dirs=[{q:0,r:-1,s:1},{q:-1,r:0,s:1},{q:-1,r:1,s:0},{q:0,r:1,s:-1},{q:1,r:0,s:-1},{q:1,r:-1,s:0}]; let c={q:r,r:0,s:-r}; for (let d=0;d<6;d++) for (let s=0;s<r;s++) { h.push({q:c.q,r:c.r,s:c.s}); c=hexAdd(c,dirs[d]); } return h; }
        function generateResources(hexPositions) {
            let pool=[]; RESOURCE_TYPES.forEach((t,i)=>{for(let j=0;j<RESOURCE_DISTRIBUTION[i];j++) pool.push(t);});
            const hl=[...hexPositions], ps=new Set(hl.map(hexKey));
            hl.sort((a,b)=>hexNeighbors(b).filter(n=>ps.has(hexKey(n))).length-hexNeighbors(a).filter(n=>ps.has(hexKey(n))).length);
            for(let at=0;at<2000;at++){const as=new Map(),rm=shuffleArray([...pool]);let ok=true;
                for(let i=0;i<hl.length;i++){const h=hl[i],u=hexNeighbors(h).map(hexKey).map(k=>as.get(k)).filter(t=>t);let pl=false;for(let r=0;r<rm.length;r++){if(rm[r]===null)continue;if(!u.includes(rm[r])){as.set(hexKey(h),rm[r]);rm[r]=null;pl=true;break;}}if(!pl){ok=false;break;}}if(ok)return as;shuffleArray(pool);}
            const fb=new Map(),fbp=shuffleArray([...pool]);hl.forEach((h,i)=>fb.set(hexKey(h),fbp[i]));return fb;
        }
        function generateNumbers(hexPositions, resourceMap) {
            const np=[2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12],hl=[...hexPositions],ps=new Set(hl.map(hexKey));
            hl.sort((a,b)=>hexNeighbors(b).filter(n=>ps.has(hexKey(n))).length-hexNeighbors(a).filter(n=>ps.has(hexKey(n))).length);
            for(let at=0;at<4000;at++){const as=new Map(),uc={},rm=shuffleArray([...np]);let ok=true;
                for(let i=0;i<hl.length;i++){const h=hl[i],k=hexKey(h),rt=resourceMap.get(k),un=hexNeighbors(h).map(hexKey).map(x=>as.get(x)).filter(n=>n!==undefined);let pl=false;for(let r=0;r<rm.length;r++){if(rm[r]===null)continue;const n=rm[r];if(un.includes(n))continue;const co=n+':'+rt;if(uc[co])continue;as.set(k,n);uc[co]=true;rm[r]=null;pl=true;break;}if(!pl){ok=false;break;}}if(ok)return as;}
            const fb=new Map(),fbn=shuffleArray([...np]);hl.forEach((h,i)=>fb.set(hexKey(h),fbn[i]));return fb;
        }
        function generateOcean(radius, landHexes) {
            const hexes=generateHexRing(radius),ls=new Set(landHexes.map(hexKey));
            function getLE(h){const n=hexNeighbors(h),e=[];for(let i=0;i<6;i++)if(ls.has(hexKey(n[i])))e.push((6-i)%6);return e;}
            function getPC(le){const t=[];for(let c=0;c<6;c++){const e1=(c-1+6)%6,e2=c;t[c]=le.includes(e1)||le.includes(e2);}for(let c=0;c<6;c++){const c2=(c+1)%6;if(t[c]&&t[c2])return[c,c2];}return null;}
            const off=Math.floor(Math.random()*hexes.length),ord=hexes.map((_,i)=>hexes[(i+off)%hexes.length]);
            const tp=Math.ceil(ord.length/2),sr=shuffleArray(['wood','brick','geese','water','stone']);let si=0,pc=0;const m=new Map();
            for(let i=0;i<ord.length;i++){const h=ord[i],k=hexKey(h);if(i%2===0){const le=getLE(h),pcor=getPC(le);if(!pcor){m.set(k,{type:'ocean',resource:null,landEdges:[],portCorners:null});continue;}let t=(pc%2===0)?'port3':'port2';if(pc===tp-1)t='port2';const r=(t==='port2')?sr[si++%sr.length]:null;m.set(k,{type:t,resource:r,landEdges:le,portCorners:pcor});pc++;}else m.set(k,{type:'ocean',resource:null,landEdges:[],portCorners:null});}
            return m;
        }
        function generateMap(){const c={q:0,r:0,s:0},r1=generateHexRing(1),r2=generateHexRing(2),r3=generateHexRing(3),lh=[...r1,...r2],r=generateResources(lh);r.set(hexKey(c),'desert');const n=generateNumbers(lh,r),o=generateOcean(3,lh);return{center:c,ring1:r1,ring2:r2,ring3:r3,resources:r,numbers:n,ocean:o};}

        // Load volume settings on page load
        loadVolumeSettings();
    </script>
